<div id="admin-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://cppdsvlywsxordummnzd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kkV5dPvXAfJa39lulMa-cg_sFeRZR-F";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadToolsProjects() {
    const container = document.getElementById("user-projects");

    const { data, error } = await supabase
      .from("submissions")
      .select("*")
      .eq("category", "tools")
      .eq("status", "approved")
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML = "<p>Couldn't load projects right now.</p>";
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = "<p>No community projects yet — be the first to submit!</p>";
      return;
    }

    container.innerHTML = data.map(project => `
      <div class="project-card">
        <h3>${project.title}</h3>
        <p>${project.description}</p>
        <a href="${project.link}" target="_blank">View Project</a>
      </div>
    `).join("");
  }

  loadToolsProjects();
</script>
</body>
